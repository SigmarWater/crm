#  buf.yaml — конфигурационный файл для инструмента Buf,
#  который используется для работы с Protocol Buffers (Protobuf)

# Он говорит Buf:
#«Для моих .proto мне нужны вот эти protobuf-библиотеки».

# Указывает версию формата конфигурации Buf.
version: v2

# Задает buf root - то есть crm/proto
# Поэтому все импорты относительно crm/proto -> "crm/v1/crm_messages.proto"
modules:
  - path: .


# Настройки линтера для проверки качества proto-файлов:
lint:
  use:
    - STANDARD
    - COMMENT_ENUM
    - COMMENT_MESSAGE
  except:
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
# Какие папки игнорировать
  ignore:
    - google
    - validate